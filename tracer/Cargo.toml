[package]
name = "tracer"
version = "0.0.0"
edition = "2024"
publish = false

# The host side of the tracer (twr-ggw.2): the fixtures (sshd, relay, HTTPS), the headless-Chrome
# driver, and the checks on the served build. Never compiled for wasm32 and never served.

[dependencies]
tau-web = { path = "..", features = ["tracer"] }
tokio = { version = "1", features = ["rt", "macros", "net", "process", "time", "sync", "io-util"] }
russh = { version = "0.63", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json = "1"
k256 = { version = "0.13", default-features = false, features = ["schnorr"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
